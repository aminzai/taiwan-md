name: PR Content Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    # 2026-05-03 cross-lang-baseline post-mortem: PR #797 1435 file change 撞
    # GitHub Actions「Argument list too long」shell limit。PR review 只對
    # CONTENT / ENGINEERING change 有意義 — 純 docs/ memory/ diary/ reports/
    # PR 跳過避免 false-fail + 加速 CI。
    paths:
      - 'knowledge/**'
      - 'src/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get changed files
        id: files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/tools/pr-changed-files.mjs

      - name: Label PR type
        if: steps.files.outputs.pr_type == 'mixed'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['mixed-pr']
            });

      - name: Skip non-content PRs
        if: steps.files.outputs.pr_type == 'engineering'
        run: echo "⏭️ Engineering PR — skipping content review"

      - name: Run content review
        if: steps.files.outputs.pr_type == 'content' || steps.files.outputs.pr_type == 'mixed'
        id: review
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          from pathlib import Path
          files = json.loads(Path('.pr-changed-files.json').read_text())['content']
          result = subprocess.run(['bash', 'scripts/tools/review-pr.sh', *files], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          output = re.sub(r'\x1b\[[0-9;]*m', '', result.stdout)
          Path('pr-review-result.txt').write_text(output)
          print(output)
          status = 'fail' if result.returncode or '🔴 FAIL' in output else 'warning' if '🟡 WARNING' in output else 'pass'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'exit_code={result.returncode}\nstatus={status}\n')
          PYTHON

      - name: Comment review result
        if: steps.files.outputs.pr_type == 'content' || steps.files.outputs.pr_type == 'mixed'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const result = require('fs').readFileSync('pr-review-result.txt', 'utf8').slice(0, 55000);
            const status = '${{ steps.review.outputs.status }}';
            
            let header = '';
            if (status === 'pass') header = '## ✅ 自動審核通過';
            else if (status === 'warning') header = '## 🟡 自動審核通過（有建議）';
            else header = '## 🔴 自動審核未通過';
            
            const body = `${header}\n\n\`\`\`\n${result}\n\`\`\`\n\n---\n*Taiwan.md PR Review Bot • 四層免疫系統*`;
            
            // Find and update existing bot comment, or create new
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body.includes('Taiwan.md PR Review Bot'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Label result
        if: steps.files.outputs.pr_type == 'content' || steps.files.outputs.pr_type == 'mixed'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const status = '${{ steps.review.outputs.status }}';
            const labels = {
              pass: 'ready-for-review',
              warning: 'needs-review',
              fail: 'needs-work'
            };
            const removeLabels = ['ready-for-review', 'needs-review', 'needs-work'];
            
            // Remove old labels
            for (const label of removeLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label,
                });
              } catch (e) { /* label not present */ }
            }
            
            // Add new label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [labels[status]],
            });

      - name: Fail on review failure
        if: (steps.files.outputs.pr_type == 'content' || steps.files.outputs.pr_type == 'mixed') && steps.review.outputs.status == 'fail'
        run: |
          echo "Content review failed. See the Run content review log for details."
          exit 1
