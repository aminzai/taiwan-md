id: C位
category: media
fork_type: C
display:
  taiwan: 中間位 / 主位（無固定對應）
  china: C位
etymology:
  origin: Center 的縮寫加「位」，源自中國選秀節目（《偶像練習生》《創造101》）的舞台中心位競爭文化，衍生「C位出道」。台灣綜藝與團體文化沒有發展出對應單詞，多描述性地說「站中間」「主打成員」。因無替代詞，台灣娛樂新聞已直接沿用。
notes: 無公認台灣對應，媒體已收編使用。
sources:
  - https://www.readr.tw/post/2553
