fork_type: F
auto_convert: false # 命中自家正文 ≥ 20 處，同形異義風險高（2026-09-05 sweep 批四）
display:
  taiwan: 串流
  china: （數據）流 / 流媒體
etymology:
  origin: 「串流」是台灣自己的譯詞，不是中國傳入。兩岸電腦術語對照表（如台灣與中國的計算機術語對照表）明確列出「串流（Stream）」為台灣用詞，中國對應說法是「（數據）流」「流媒體」。台灣既有詞條「串流媒體」（[串流媒體.yaml](串流媒體.yaml)）也記錄了同一組對照。
  taiwan_path: 「串流」「串流媒體」「串流平台」「線上串流」等衍生詞在台灣科技媒體與一般用語中通行已久。
  china_path: 中國慣用「流媒體」，較少使用「串流」這個字根，日常也常直接說「（數據）流」。
  fork_cause: 兩岸資訊科技譯詞各自定型，不是分歧輸入，而是台灣自造詞彙。
usage:
  taiwan_formal: true
  taiwan_casual: true
status: stable
notes: |
  誤判翻案案例：SC 讀者搜尋「串流」想確認是不是支語，但查證結果相反——「串流」正是台灣自己的用詞，
  中國同概念說「流媒體」或「（數據）流」。跟「踩雷」「痛點」一樣，都是讀者把方向搞反的案例。
