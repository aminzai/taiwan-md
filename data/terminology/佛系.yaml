id: 佛系
category: slang
fork_type: A
display:
  taiwan: 佛系（已在地化；近似「隨緣」「厭世代」語感）
  china: 佛系
etymology:
  origin: 源自 2014 年日本雜誌《non-no》的「仏男子」（對戀愛淡泊的男性），2017 年經中國自媒體改造成「佛系青年」爆紅，指對競爭無欲無求、怎樣都行的生活態度，再傳入台灣。台灣同期自己長出「厭世代」一詞，兩者描述相近的世代情緒但視角不同：佛系是自嘲放下，厭世是無力控訴。
notes: 日源詞經中國二次加工再輸入的典型路徑（同型：打call、課金→氪金）。常被誤判為中國原創。
sources:
  - https://zh.wikipedia.org/zh-tw/佛系
  - https://www.fountmedia.io/article/108385
