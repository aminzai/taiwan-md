id: 修補程式
category: tech
subcategory: 軟體與程式開發
fork_type: C

display:
  taiwan: 修補程式
  china: 補丁

etymology:
  origin: 修正軟體漏洞或錯誤的 patch。台灣說「修補程式」（也說「更新檔」），中國取 patch 的「補丁」意象（在破洞上縫一塊布）直譯。

usage:
  example: 這款遊戲昨天出了修補程式，把之前一直閃退的問題修好了。

notes: ''

sources:
  - 'ThunderKO C2T / 《大陸用語檢索手冊》1997'

