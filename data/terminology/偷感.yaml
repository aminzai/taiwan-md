id: 偷感
category: slang
fork_type: C
display:
  taiwan: 無公認對應（做事怕被注意的彆扭感）
  china: 偷感
etymology:
  origin: 2024 年中國網路熱詞，入選百度年度流行語，形容「做什麼都像做賊一樣不想被注意」的內向彆扭狀態：「偷感很重」。台灣媒體以「認識對岸新詞」的框架報導過，日常尚無公認對應說法，最接近的描述是「畏畏縮縮」「怕被看到」。
notes: 2024 新詞，台灣處於「被介紹」階段而非「使用」階段——收錄以追蹤其滲透軌跡。
sources:
  - https://www.i-media.tw/Article/Detail/36990
