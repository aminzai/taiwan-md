id: 儀式感
category: slang
fork_type: E
auto_convert: false # 命中自家正文 ≥ 20 處，同形異義風險高（2026-09-05 sweep 批四）
display:
  taiwan: 儀式感（已高度收編）
  china: 儀式感
etymology:
  origin: 源頭可追至《小王子》狐狸台詞的中譯（「儀式感就是使某一天與其他日子不同」），2017 年前後經中國自媒體雞湯文化爆量使用而流行語化，指刻意經營生活中的美好時刻。台灣同步吸收，如今台灣媒體、廣告、日常對話已普遍使用，多數使用者不知其流行路徑經過中國。
notes: 收編完成的「N＋感」詞。概念源自法國文學中譯，流行化引擎在中國自媒體——多層來源的典型。
