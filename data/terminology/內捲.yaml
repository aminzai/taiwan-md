id: 內捲
category: slang
fork_type: E
display:
  taiwan: 過度競爭 / 惡性競爭 / 窮忙
  china: 內捲（內卷）
etymology:
  origin: 學術概念「involution」原指農業社會勞動投入邊際報酬遞減，1985 年黃宗智引入中文學界。2018 年後被中國網路挪用轉義，指同儕在零和賽局裡被迫投入更多努力卻換不到相應回報的處境（如學生熬夜刷題、員工加班內耗），2020 年隨「內卷之王」等迷因爆紅成年度熱詞。台灣讀者近年在職場、教育話題下大量接觸此詞，但沒有現成一字對應——「過度競爭」「窮忙」「內耗」各自涵蓋部分語意，尚未收斂成單一台灣說法。
notes: Search Console 過去 28 天 34 次曝光、讀者已在搜尋但站上無對應條目，本輪列高信心優先詞。
sources:
