id: 內核
category: technology
fork_type: semantic

display:
  taiwan: 核心
  china: 內核

etymology:
  origin: 作業系統最底層、負責調度硬體資源的那一層程式（kernel）。台灣譯「核心」（Linux 核心、核心模組），中國譯「內核」。近年中國網路把「內核」擴張到形容人的精神狀態（內核穩定、內核強大），台灣沒有這個用法。

notes: |
  2026-08-22 補記：「核心」是台灣標準用詞，教育部《重編國語辭典修訂本》收錄，
  釋為「中心，主要的部分」，例句「這是問題的核心」。
  2026-08 Threads 討論串有留言主張「臺灣也完全不常講核心」，查證不成立——
  這個詞在台灣資訊界（Linux 核心）、日常語（問題的核心、核心價值）都是標準用法。

