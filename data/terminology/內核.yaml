id: 內核
category: technology
fork_type: semantic

display:
  taiwan: 核心
  china: 內核

etymology:
  origin: 作業系統最底層、負責調度硬體資源的那一層程式（kernel）。台灣譯「核心」（Linux 核心、核心模組），中國譯「內核」。近年中國網路把「內核」擴張到形容人的精神狀態（內核穩定、內核強大），台灣沒有這個用法。

notes: |
  2026-08-22 補記：「核心」是台灣標準用詞，教育部《重編國語辭典修訂本》收錄，
  釋為「中心，主要的部分」，例句「這是問題的核心」。
  2026-08 Threads 討論串有留言主張「臺灣也完全不常講核心」，查證不成立——
  這個詞在台灣資訊界（Linux 核心）、日常語（問題的核心、核心價值）都是標準用法。
  2026-09-30 補記（讀者程乙路 issue #1786）：讀者指出查字典應該用《國語辭典簡編本》
  而不是《重編國語辭典修訂本》。這個方法論意見成立——簡編本收的是當代通用詞，
  重編本是歷史語言辭典、連罕用與古語都收，拿它證明「某詞在台灣是常用詞」本來就
  是錯的尺。改用讀者指定的那把尺重查，結論不變：簡編本有「核心」條，釋為
  「中心，主要的部分」，例句「找出問題的核心，才能儘快解決問題」。
  這條的斷言因此改引簡編本，重編本降為輔證。
  用哪一部辭典當全庫複查的篩子，是 OBSERVER-QUEUE #76 的待決範圍，不在本條處理。

