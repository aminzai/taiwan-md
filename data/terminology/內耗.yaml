id: 內耗
category: slang
fork_type: E
display:
  taiwan: 內心戲太多 / 自我消耗
  china: 內耗（精神內耗）
etymology:
  origin: 「精神內耗」是 2020 年代中國心理學自媒體熱詞，2022 年 B 站影片《回村三天，二舅治好了我的精神內耗》爆紅後成為年度流行語，指反覆自我懷疑、想太多而耗盡心力。台灣傳統會說「內心戲太多」「自己嚇自己」「想太多」。台灣讀者近年在 Google 大量搜尋此詞（本站 Search Console 單月 233 次曝光居缺口詞之首），顯示需求真實存在。
notes: 「內耗」二字台灣原用於組織管理語境（企業內耗）；「精神內耗」的個人心理用法是中國網路輸入。
sources:
  - https://zh.wikipedia.org/zh-tw/回村三天，二舅治好了我的精神内耗
