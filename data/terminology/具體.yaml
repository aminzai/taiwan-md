id: 具體
category: daily
subcategory: 日常用語
fork_type: F
auto_convert: false # 同詞不同語感：中國側的詞在台灣另有正當用法，盲目取代會改壞正確文字
display:
  taiwan: 明確 / 確切 / 詳細
  china: 具體（給我具體時間、具體怎麼說）
etymology:
  origin: 「具體」指有實體、不抽象，教育部《重編國語辭典修訂本》收錄並舉例「解決問題，不要空談，應提出具體的辦法」——是台灣標準用詞。分歧發生在口語裡把「具體」當作疑問句的修飾前綴：「具體怎麼說」「具體什麼情況」，這種用法在中國口語很常見，功能接近贅詞。
  taiwan_path: 台灣問細節時說「詳細怎麼說」「到底什麼情況」「明確的時間是什麼時候」，「具體」多用於「具體措施」「具體作法」這類名詞前修飾。
  china_path: 中國口語把「具體」擴張成通用的細節追問前綴，「具體是」「具體來說」「具體怎麼弄」高頻出現。
  fork_cause: 同一個詞的語法位置擴張，不是詞彙替換——這種滲透比名詞替換隱蔽，因為每個字都是台灣本來就有的。
usage:
  example: 給我明確的時間，我才好安排。
  taiwan_formal: true
  taiwan_casual: true
  exceptions: 「具體措施」「具體而微」「具體成果」是台灣標準用法，與本條無關。
status: shifting
notes: |
  ⚠️ 查證分歧誠信標註：詞是台灣本有，爭的是「具體怎麼說」這種口語修飾用法。
  Threads 用語策展者 @thiankiu.to 2026-08 的整理寫得很清楚：「具體數據」台灣會用「詳細資料」、
  「給我具體時間」台灣會講「給我明確（確切）的時間」。被他引用的原留言（@nataliegreenday，自述 68 年次）
  則把「體現、具體、關注、舉報」整組認定為中國用語，並回憶「從小到大在台灣聽到的就是呈現、明確、焦點、檢舉」。
  查證結果只支持一半：「具體」確實在教育部辭典裡、確實是台灣正式書寫會用的詞，
  記憶中的世代語感差異是真的，但推論到「這個詞不是台灣的」就過頭了。
sources:
  - https://www.moedict.tw/uni/具體
  - https://www.threads.com/@marugoigoi/post/DcSu1TSkRMV
