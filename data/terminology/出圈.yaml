id: 出圈
category: slang
fork_type: E
display:
  taiwan: 爆紅 / 破圈 / 打入主流
  china: 出圈
etymology:
  origin: 源自中國「飯圈」（追星社群）用語，指原本只在小眾同好圈子（圈）內流行的人事物擴散到主流大眾視野，隨陸劇、中國選秀節目與短影音文化傳入台灣年輕世代的日常用語。台灣傳統說法是「爆紅」「翻紅」「打入主流」。
notes: 用法脈絡明確源自中國飯圈文化，屬長期穩定使用的中國網路用語（非本輪新造詞），誤判風險低。
sources:
  - https://dailyview.tw/popular/detail/24074
