id: 出片
category: slang
fork_type: C
display:
  taiwan: 很好拍 / 拍起來很讚
  china: 出片
etymology:
  origin: 小紅書攝影與旅遊圈用語：「出片」指一個地點或穿搭「能拍出好照片」，衍生「出片率」「出片聖地」。台灣慣說「很好拍」「網美景點」。台灣旅遊業者與網美帳號受小紅書內容影響，此詞已在 IG 文案出現。本站 Search Console 顯示台灣讀者在查詢此詞。
notes: 與「網美景點」對照：台灣以「人」為軸造詞（網美），中國以「產出」為軸造詞（出片）。
sources:
