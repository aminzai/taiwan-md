etymology:
  origin: 電商物流用語分流：台灣蝦皮、momo 等平台與賣家慣用「出貨」「已出貨」，中國淘寶生態用「發貨」「已發貨」「發貨通知」。台灣消費者在淘寶、拼多多跨境購物時大量接觸「發貨」，PTT 與 Dcard 都有網友點名此詞已在台灣賣場訊息中出現。
