id: 割韭菜
category: business
fork_type: C
display:
  taiwan: 坑殺散戶 / 當韭菜割
  china: 割韭菜
etymology:
  origin: 中國股市用語：韭菜割了會再長，比喻散戶被大戶反覆收割仍前仆後繼。隨加密貨幣與投資社群文化傳入台灣，台灣財經圈原說「坑殺散戶」「倒貨給散戶」。「韭菜」自稱文化（自嘲是待割韭菜）已被台灣投資社群完整採用。
notes: 台灣投資圈已高度收編，「韭菜」自嘲用法尤其普及。
sources:
  - https://zh.wikipedia.org/zh-tw/割韭菜
