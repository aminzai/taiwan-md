id: 反精致
category: slang
fork_type: E
display:
  taiwan: 反矯情 / 不擺拍
  china: 反精致（反精緻）
etymology:
  origin: 中國小紅書 2026 年度熱詞，對前幾年「精緻生活」美學（過度修飾、擺拍式呈現）的反彈，主張追求真實自然、不刻意經營的生活風格。台灣概念上接近「反矯情」，但作為固定詞組尚未見台灣網路普遍使用。
notes: 屬 2026 上半年小紅書熱詞榜，是對「精緻窮」美學風潮的反向修正詞，列入觀察。
sources:
  - https://www.163.com/dy/article/KQUHNKA30531B128.html
added: '2026-08-05'
updated: '2026-08-05'
