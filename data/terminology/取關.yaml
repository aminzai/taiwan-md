id: 取關
category: internet
fork_type: C
display:
  taiwan: 退追 / 取消追蹤
  china: 取關
etymology:
  origin: 「取消關注」的縮略。兩岸社群平台介面用語分流：微博體系用「關注／取關」，台灣的 FB／IG 在地化用「追蹤／退追」。台灣網友點名「取關」是「明明已經用台灣版本說了很久，卻不知不覺變了」的代表詞之一。
notes: 平台介面詞（關注／點讚／轉發 vs 追蹤／按讚／分享）成組分流，介面在地化是台灣用語的防線。
sources:
