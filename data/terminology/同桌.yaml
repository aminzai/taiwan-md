id: 同桌
category: education
fork_type: B
display:
  taiwan: 坐我隔壁的同學（無單詞對應）
  china: 同桌
etymology:
  origin: 中國學校教室慣用雙人課桌，「同桌」（共用一張桌子的同學）因此成為承載青春記憶的重要詞彙（歌曲《同桌的你》）。台灣教室以單人課桌為主，只能描述性地說「坐我隔壁的同學」，沒有對應單詞。Threads 熱議貼文（6,244 讚）：「『同桌』是不是支語啊，在台灣要怎麼表達？我一瞬間根本想不到！」——詞彙缺口反映的是教室家具與校園文化的實體差異。
notes: 「詞彙缺口源自文化實體差異」的乾淨案例：不是翻譯問題，是台灣真的沒有這個東西。
