id: 塌房
category: media
fork_type: C
display:
  taiwan: 偶像形象崩壞 / 人設崩壞
  china: 塌房
etymology:
  origin: 中國飯圈用語：粉絲把支持偶像比喻成「蓋房子」，偶像爆出戀愛或醜聞導致粉絲夢碎就是「房子塌了」。2021 年中國偶像圈連環醜聞讓此詞爆紅。台灣說「形象崩壞」「人設崩壞」，語感較中性，缺乏「塌房」裡粉絲第一人稱的心碎視角。
notes: 飯圈詞族（塌房／脫粉／回踩／番位）整組跟著中國選秀文化輸入台灣追星圈。
sources:
