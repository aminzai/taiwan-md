etymology:
  origin: 台灣外送平台文化（foodpanda、Uber Eats）確立了「外送」「外送員」的標準說法；中國美團、餓了麼生態則用「外賣」「外賣小哥」。兩詞在 2010 年代平台經濟興起後各自定型，是新生活型態催生的平行詞彙。台灣媒體報導中國外送產業時常直接沿用「外賣」，造成混用。
