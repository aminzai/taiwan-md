id: 天花板
category: slang
fork_type: E
auto_convert: false # 命中自家正文 ≥ 20 處，同形異義風險高（2026-09-05 sweep 批四）
display:
  taiwan: 頂尖 / 最高標竿 / 天花板
  china: 天花板
etymology:
  origin: 形容某領域的最高水準（「演技天花板」），源自「觸及天花板＝到頂」的比喻。起源有爭議：Dcard 支語清單收錄它，但也有查證指台灣 2022 年選秀節目《原子少年》已用「天花板」形容頂尖團體，經濟學「玻璃天花板」的比喻更早就通行兩岸。可確定的是「XX天花板」的句式化爆量使用是中國網路帶動。
notes: 起源爭議詞：比喻本身兩岸皆有，句式化流行由中國輸入。查證管道結論相互矛盾的活案例。
