id: 奧步
category: daily
fork_type: E
display:
  taiwan: 奧步（台語「歹步」音轉，指卑劣手段）
  china: 奧步 / 撇步 / 毋湯
etymology:
  origin: 中研院語言學研究所蕭素英團隊考證，「奧步」「撇步」（訣竅）「毋湯」（不可以，台語「毋通」音轉）都源自台語，是台灣選舉政治語言與網路用語「反向輸出」到中國、港澳、星馬華語圈的案例，不是中國傳入台灣的用語。
notes: '⚠️ 誤判翻案案例：常被簡化認為「兩岸共用詞必是支語傳入」，這幾個詞剛好證明方向相反——台灣製造、反向風靡整個華語圈，可作為反駁過度簡化推論的參考案例。'
sources:
  - https://research.sinica.edu.tw/linguistics-southern-min-modern-mandarin/
  - https://www.storm.mg/lifestyle/3052904
  - https://storystudio.tw/article/gushi/linguistics-southern-min-modern-mandarin
