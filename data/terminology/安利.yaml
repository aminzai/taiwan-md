id: 安利
category: slang
fork_type: C
display:
  taiwan: 推坑 / 大推
  china: 安利
etymology:
  origin: 源自直銷品牌 Amway（安利）在中國的形象——熱情到讓人招架不住的推銷，網路轉義為「熱情推薦」：「安利一部劇」「吃下這顆安利」。台灣 ACG 圈本有「推坑」（把人推進某個興趣的坑），語意幾乎完全對應且更早存在。
notes: 台灣「推坑」是原生對應詞，抵換率高。品牌名轉義詞（同型：百度一下）依賴在地品牌認知，跨境後語源常失落。
sources:
  - https://www.ptt.cc/bbs/WomenTalk/M.1672998855.A.CD5.html
