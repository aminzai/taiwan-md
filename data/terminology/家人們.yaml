id: 家人們
category: internet
fork_type: C
display:
  taiwan: 大家 / 各位
  china: 家人們（家人們誰懂啊）
etymology:
  origin: 中國直播帶貨文化的觀眾稱呼，主播以「家人們」營造親密感促進下單，衍生句式「家人們誰懂啊」表委屈求共鳴。台灣直播主慣稱「大家」「各位觀眾」「寶寶們」。PTT 與 Threads 網友對此詞反感度高（「比『親』更讓我起肖」），因親屬稱謂的商業挪用在台灣語感中顯得過度。
notes: 「家人們誰懂啊」整句已成迷因句式，台灣多為反串使用。
sources:
  - https://www.ptt.cc/bbs/WomenTalk/M.1691117819.A.B8C.html
  - https://www.threads.com/@lupei404/post/C4s-AVHKIAF
