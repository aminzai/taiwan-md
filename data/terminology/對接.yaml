category: business
fork_type: E
auto_convert: false # 命中自家正文 ≥ 20 處，同形異義風險高（2026-09-05 sweep 批四）
display:
  taiwan: 接洽 / 對口 / 串接
  china: 對接
etymology:
  origin: 原是航太術語（太空船對接），中國職場語境把它泛化成「兩個單位建立合作聯繫」的萬用動詞：對接需求、對接窗口、跟客戶對接。台灣職場慣說「接洽」「聯繫」，公部門說「對口單位」，工程師說系統「串接」。台灣讀者在搜尋引擎查詢此詞的量持續上升，顯示職場滲透真實發生。
notes: 台灣科技業與新創圈已高頻使用，屬職場黑話滲透最深的一批。
