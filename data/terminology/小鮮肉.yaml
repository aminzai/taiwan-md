id: 小鮮肉
category: media
fork_type: E
display:
  taiwan: 年輕帥哥 / 小鮮肉
  china: 小鮮肉
etymology:
  origin: 中國娛樂圈 2014 年前後定型的詞，指年輕俊美的男藝人，隱含「以外貌為主要資本」的評價。台灣媒體快速跟進使用，如今演藝新聞已普遍可見，屬高度收編詞。台灣原有說法是描述性的「年輕帥哥」「奶油小生」（更早世代）。
notes: 「奶油小生」是台灣 1980 年代同概念詞，可做世代對照。對男性外貌的物化用語，兩岸皆有相關討論。
sources:
