id: 巨好吃
category: daily
fork_type: E
display:
  taiwan: 超好吃 / 有夠好吃
  china: 巨好吃
etymology:
  origin: 「巨」當程度副詞，相當於「超」「非常」。中國網路與廣告文案愛用這種放大式修飾（巨好吃、巨能寫、巨方便），台灣同一位置用「超」「有夠」「爆」（超好吃、有夠好吃、好吃爆）。
notes: |
  2026-08-22 補記：這條屬於程度副詞層的分歧，同族還有 [挺](挺.yaml)（台灣說蠻／滿）。
  副詞層的替換比名詞層隱蔽——每個字台灣都有，變的是修飾習慣。
  一位台灣創作者記錄自己 2020 年就因為在影片講「巨」被出征，可見這條線已經被注意很久。
  原始來源：caris-events/invade (CC0)。
