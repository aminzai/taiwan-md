id: 座標
category: daily
subcategory: 日常生活
fork_type: B

display:
  taiwan: 座標
  china: 坐標

etymology:
  origin: 兩層分歧疊在同一個詞上。字形層：台灣寫「座標」，中國寫「坐標」，這是 1997 年《大陸用語檢索手冊》就記錄的老分歧。語意層：中國網路把「座標」拿來當「所在地」用，社群自我介紹寫「座標：北京」，台灣則說「地點」「位置」「人在台中」——座標在台灣仍是要有數值的東西（經緯度、平面座標）。

usage:
  taiwan_formal: true
  taiwan_casual: true

notes: |
  2026-08-22 補記語意層：原條目只記錄字形分歧（座標／坐標）。
  2026-08 Threads 一則逾 2,000 瀏覽的貼文點出第二層：「座標：臺中」這種寫法是中國用法，
  台灣講地點、縣市、位置。這類「同字形、被塞進新義項」的滲透比字形分歧隱蔽得多，
  同型案例可對照 [流量](流量.yaml)（物理量→人氣）。

sources:
  - 'ThunderKO C2T / 《大陸用語檢索手冊》1997'
