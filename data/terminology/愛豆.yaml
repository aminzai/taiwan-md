id: 愛豆
category: media
fork_type: C
display:
  taiwan: 偶像
  china: 愛豆
etymology:
  origin: 英文 idol 的中國音譯，經韓流粉絲圈定型，指偶像藝人，衍生「豆」系詞（男豆、女豆、糊豆）。台灣追星圈直接用「偶像」或英文「idol」，日系粉絲圈用「推し」衍生的「推」。「愛豆」在台灣的使用集中於追中國偶像產業的粉絲社群。
notes: 音譯 vs 意譯的分流案例：同一個 idol，中國音譯「愛豆」、台灣沿用意譯「偶像」。
sources:
  - https://zh.wikipedia.org/zh-tw/偶像
