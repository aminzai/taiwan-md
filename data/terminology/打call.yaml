id: 打call
category: media
fork_type: A
display:
  taiwan: 應援 / 加油
  china: 打call
etymology:
  origin: 源自日本偶像文化的「コール」（call，觀眾隨音樂節奏喊口號），中國網路 2017 年前後把「打call」泛化成「為某人加油、支持」，脫離了原本的現場應援脈絡。台灣追星圈保留日源的「應援」（同樣是日語借詞），語意更接近原始用法。
notes: 日源詞經中國語意泛化後輸入。台灣「應援」與中國「打call」是同一個日本文化的兩次借用。
sources:
  - https://disp.cc/b/ChinaDrama/dq92
