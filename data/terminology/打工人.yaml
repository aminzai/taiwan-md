id: 打工人
category: slang
fork_type: E
display:
  taiwan: 社畜（日源）/ 上班族
  china: 打工人
etymology:
  origin: 2020 年中國網路自嘲熱詞，把所有受僱者（不分白領藍領）統稱「打工人」，衍生早安問候迷因「早安，打工人」。台灣同期流行的自嘲詞是日源的「社畜」（會社＋家畜）。兩岸各自借了不同來源表達同一種勞動異化的自嘲：中國自造「打工人」，台灣借日語「社畜」——是平行借詞的教科書案例。
notes: 台灣「社畜」vs 中國「打工人」：同一世代情緒、兩條借詞路徑，適合對照呈現。
sources:
