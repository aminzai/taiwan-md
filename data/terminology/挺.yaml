id: 挺
category: daily
subcategory: 日常用語
fork_type: F
auto_convert: false # 同詞不同語感：中國側的詞在台灣另有正當用法，盲目取代會改壞正確文字
display:
  taiwan: 蠻 / 滿
  china: 挺（挺好的、挺不錯的）
etymology:
  origin: 程度副詞，相當於「很」「相當」。這個字不是中國新造詞——教育部《重編國語辭典修訂本》「挺」字下明列副詞義「很、甚」，書證引《兒女英雄傳》第三一回「挺長挺深的一個大口子」，例句寫「他人緣挺好。」「她待人挺和氣。」《兒女英雄傳》是清代京味小說，說明「挺」當程度副詞的老家在北方官話。
  taiwan_path: 台灣口語長年偏好「蠻」「滿」（蠻好的／滿不錯的），兩字副詞義通用、常混用，字典曾建議以「滿」為宜。「挺」在台灣多用於「挺胸」「筆挺」「挺不住」等本義，當程度副詞的頻率遠低於「蠻／滿」。
  china_path: 中國普通話以北方官話為基底，「挺＋形容詞＋的」是最常見的溫和程度表達，「挺好的」幾乎是預設說法。
  fork_cause: 不是詞彙有無的分歧，是使用頻率的分歧。短影音與中國影視大量輸入後，台灣年輕世代的口語與網路書寫開始出現「挺」取代「蠻／滿」的位移。
usage:
  example: 這間店的咖啡蠻好的。／今天天氣滿不錯的。
  taiwan_formal: true
  taiwan_casual: true
  exceptions: 「挺胸」「筆挺」「挺住」「力挺」等本義用法是台灣日常詞彙，與本條無關。
status: shifting
notes: |
  ⚠️ 查證分歧誠信標註：這是「同一個詞、兩岸使用頻率不同」的典型，不是外來詞入侵。
  討論這題的網友自己就分成兩派——2026-08 一則 4.6 萬瀏覽的 Threads 貼文問「為什麼大家不太用『蠻』了，都用『挺少的』『挺好的』」，
  留言區有人指出「挺」在近代白話文學就是程度副詞、有人查過「滿／蠻」副詞通用，也有人直接說「怕有人會硬拗是支語」。
  反方立場同樣有理據：Threads 用語策展者 @thiankiu.to 主張「支語不是單看教育部辭典有沒有這個詞這麼簡單」，
  辭典收錄證明的是「不是中共新造詞」，不等於「台灣口語慣用」。本條記錄的是頻率位移這個事實本身，不做判定。
  另注意：留言區同時在吵的「蠻 vs 滿哪個才是正字」是台灣內部的用字問題，跟兩岸用語是兩件事。
sources:
