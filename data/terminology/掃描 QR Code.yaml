etymology:
  origin: 中國行動支付（支付寶、微信支付）普及讓「掃碼」成為日常動詞，掃碼支付、掃碼點餐、掃碼加好友。台灣慣說「掃 QR Code」或「掃條碼」，保留英文縮寫。疫情實聯制時期台灣官方用語也是「掃描 QR Code」。Threads 網友形容掃碼是「最看不慣，卻又不得不用的支語之一」，因為它確實比四音節的「掃 QR Code」短。
