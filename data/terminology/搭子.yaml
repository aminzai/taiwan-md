id: 搭子
category: slang
fork_type: C
display:
  taiwan: 飯友 / 牌咖（台灣「〜咖」構詞）
  china: 搭子
etymology:
  origin: 源自江南（上海）方言，原指牌桌上的固定牌友，2023 年中國網路把它擴大成「單一用途的淺社交關係」：飯搭子、旅遊搭子、健身搭子，入選年度流行語。台灣本有「〜咖」構詞承載相同概念：牌咖、飯咖、咖啡咖（台語「跤／腳」，夥伴之意），語意幾乎一對一。Threads 已有台灣網友明確主張改用「夥伴／旅伴」。
notes: 方言詞（江南）擴義後全國化再輸出。台灣「〜咖」是原生對應構詞，抵換率高——適合轉換器主打。
sources:
