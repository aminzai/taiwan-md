id: 智商稅
category: slang
fork_type: E
display:
  taiwan: 繳智商稅 / 當盤子
  china: 智商稅
etymology:
  origin: 中國網路對「因判斷力不足而花的冤枉錢」的比喻：買到誇大療效產品＝繳智商稅。台灣本有「盤子」（台語「潘仔」，凱子、冤大頭）承載相同語意，「當盤子」「盤子價」至今活躍。兩詞視角不同：智商稅嘲諷買家智力，盤子嘲諷買家被當肥羊。
notes: 台灣本有對應（盤子）且語感更在地，屬可抵換詞。
sources:
  - https://dailyview.tw/popular/detail/21332
