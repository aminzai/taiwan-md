id: 槓精
category: slang
fork_type: C
display:
  taiwan: 愛抬槓的人 / 唱反調魔人
  china: 槓精
etymology:
  origin: 中國網路對「為反對而反對、事事抬槓」網友的稱呼，「精」字仿妖精修煉成精的構詞（同族：檸檬精、戲精、杠精）。台灣描述性地說「愛抬槓」「唱反調」，或用「魔人」構詞（正義魔人、糾察魔人）表達同類概念——兩岸各自的「成精」與「成魔」構詞法是有趣的平行。
notes: 「精」系構詞（槓精／檸檬精／戲精）vs 台灣「魔人」系構詞（正義魔人）是兩岸網路構詞學的對照組。
sources:
