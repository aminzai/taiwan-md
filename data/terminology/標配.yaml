id: 標配
category: business
fork_type: C
display:
  taiwan: 標準配備 / 基本款
  china: 標配
etymology:
  origin: 汽車與 3C 產業術語「標準配備」的中國縮略形，對應詞是「頂配」「低配」。中國電商與評測文化讓「標配」從產品規格延伸到人生語境（「房車是結婚標配」）。台灣書面仍多用全稱「標準配備」，但口語受影響漸增，延伸用法（人生標配）則是明確的中國網路語感。
notes: 縮略形式滲透中；「頂配／低配／高配」整組詞跟著一起進來。
sources:
