id: 氛圍感
category: slang
fork_type: C
display:
  taiwan: 有氣氛 / 有情調 / 很有 fu
  china: 氛圍感
etymology:
  origin: 小紅書攝影與美妝圈造詞：「氛圍感美女」指五官不必精緻但整體氣質動人，「氛圍感照片」指重氛圍輕細節的美學。台灣說「有氣氛」「有情調」，年輕世代說「很有 fu」（feel 的台式縮略——台灣自己的外來語創造）。Threads 網友吐槽此詞文法怪異：「『氛圍感』n.＋n.？氛圍到底是什麼感覺？」
notes: 台灣「有 fu」是同概念的本土外來語方案，兩者對照可見兩岸造詞路徑差異。
sources:
  - https://www.threads.com/@issac.wds/post/C5-HzCErrWr
