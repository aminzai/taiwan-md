id: level-standard
category: daily
fork_type: F
display:
  taiwan: 水準
  china: 水平
etymology:
  origin: 兩個詞都指程度與標準，而且台灣辭典兩個都收——教育部《重編國語辭典修訂本》「水平」條下第三義即「標準、程度」，例句「他的程度不及一般水平」。所以這不是台灣有沒有這個詞的問題，是日常預設哪一個。
  taiwan_path: 台灣口語與媒體預設「水準」（生活水準、水準之上、沒水準），「水平」多保留給幾何與工程義（水平線、水平儀、水平面）。
  china_path: 中國預設「水平」通吃程度義（生活水平、業務水平、水平高），「水準」使用率低。
  fork_cause: 同義詞的預設偏好差異，非詞彙有無。
usage:
  taiwan_formal: true
  taiwan_casual: true
  exceptions: 「水平線」「水平儀」「水平思考」等幾何與工程用法是台灣標準用詞，與本條無關。
status: shifting
notes: |
  2026-08-22 校正：原條目標為 B 型（1949 分流）並斷言「台灣水準＝中國水平」，
  但教育部辭典「水平」本來就收「標準、程度」義，斷言台灣不用這個詞過頭了。
  改標 F 型（同詞不同語感），把差異定位在預設偏好而非詞彙有無。
  這是 2026-08 Threads 討論串（「水準」變「水平」「素質」）帶出的查證，
  同批查證的 [素質](素質.yaml) 亦為誤判翻案案例。
sources:
  - https://www.moedict.tw/uni/水平
  - 教育部國語辭典
  - 兩岸用語對照
added: '2026-03-30'
updated: '2026-08-22'
