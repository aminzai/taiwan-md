id: 治癒
category: slang
subcategory: 心理與情緒
fork_type: E
auto_convert: false # 兩說並存、事件未定，不適合強制找字取代
display:
  taiwan: 療癒
  china: 治癒
etymology:
  origin: 「治癒」與「療癒」在部分語境下被當作近義詞使用，但兩者本有醫學語感上的差別——治療區分為療癒（healing）與治癒（cure）兩個概念：治癒通常指驅離身體的疾病讓症狀消失，是外部介入（就醫、服藥）促成的結果；療癒則強調身心靈整合的內在復原，未必需要外力介入。台灣網路社群對「治癒」是否為支語有明確爭議：反對方認為台灣日常慣用「療癒」（療癒系、療癒小物、被療癒），且醫學語境本就使用「治癒率」等詞；主張是支語的一方則認為近年社群媒體上「治癒」被大量用在原本該說「療癒」的語境（如「這張照片好治癒」），是中國用語滲透造成的語感位移。
  fork_cause: 概念本身在兩岸都存在，爭議點在於「治癒」被挪用到原屬「療癒」的語境是否構成語言滲透，尚無定論。
usage:
  taiwan_formal: true
  taiwan_casual: true
  exceptions: 醫學語境「治癒率」「治癒疾病」在台灣是標準用法，與本條爭議的「治癒系」「好治癒」等心靈撫慰語境用法不同層次，不應混為一談。
status: shifting
notes: |
  爭議進行中，本條不下判定：Threads 上有讀者直接點名「大家忘了治癒是支語」、也有人反駁「治癒和療癒本來就有醫學語感差異」。
  兩造都有一定道理——「治癒」本身不是外來詞，但用來描述「被一張照片治癒」這種原本該用「療癒」的語境，
  確實是近年隨中國社群內容擴散進來的用法。姿態是把兩邊的論點並排放好，不裁決哪一邊對。
