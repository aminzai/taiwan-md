id: 活人感
category: slang
fork_type: E
display:
  taiwan: 不做作 / 有血有肉 / 接地氣
  china: 活人感
etymology:
  origin: 中國短影音社群 2025 年常見評論用語，稱讚公眾人物（尤其明星）狀態自然、不端架子，與「人機感」（模板化、像機器人回話）相對。2025 年 12 月入選中國官方語文刊物《咬文嚼字》年度十大流行語。台灣目前無單一對應詞，概念接近「接地氣」「不做作」。
notes: 「N＋感」造詞公式的延伸（同型：鬆弛感、氛圍感），屬 2025-2026 世代熱詞，尚未見台灣網路普遍使用，列入觀察。
sources:
