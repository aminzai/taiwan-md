id: 流量
category: media
subcategory: 網路與社群
fork_type: C
auto_convert: false # 同詞不同語感：中國側的詞在台灣另有正當用法，盲目取代會改壞正確文字
display:
  taiwan: 點閱率 / 瀏覽人次 / 人氣 / 聲量
  china: 流量（流量明星、蹭流量、流量密碼）
etymology:
  origin: 「流量」的本義是單位時間內通過某截面的量，教育部《重編國語辭典修訂本》只收這個物理義。中國網路把它引申成「一個人或一則內容能帶來多少注意力」，2014 年起中國娛樂圈出現大批粉絲數極高的年輕藝人，「流量明星」一詞定型，指人氣高但作品未必匹配的藝人，衍生出蹭流量、流量密碼、流量為王等整組說法。
  taiwan_path: 台灣網路早期講「衝人氣」「炒人氣」「點閱率」，行銷圈用「觸及」「聲量」（聲量分析是台灣網路輿情產業的固定用詞），資訊領域的「網路流量」則保留頻寬與傳輸量的技術義。
  china_path: 從電商與微博時代的數據指標，擴張成描述人的屬性（流量藝人／流量小生），再擴張成價值判斷（有沒有流量）。
  fork_point: '~2014'
  fork_cause: 中國平台經濟把「注意力可以計價」變成日常語彙，台灣沿用技術義而未發展出對應的人格化用法。
usage:
  example: 這篇文章有十萬的瀏覽人次。／他只是貼文跟風炒人氣。
  taiwan_formal: true
  taiwan_casual: true
  exceptions: 「網路流量」「流量計費」「吃到飽流量」等技術與電信用法是台灣標準用詞，與本條無關。
status: shifting
notes: |
  這是語意佔用型的分歧：詞台灣本來就有，被塞進一個新的義項。
  Threads 用語策展者 @thiankiu.to 2026-06 兩則貼文（合計逾 1,200 讚）整理的替代說法可以直接當例句：
  「他的影片是花錢買點閱才有這麼高的觀看數」「他沒買這檔股票，只是貼文跟風炒人氣」「這篇文章有十萬的瀏覽人次」。
  台灣行銷圈已在用的「聲量」其實是最接近中國「流量」人格化用法的本地詞。
sources:
  - https://www.moedict.tw/uni/流量
  - https://zh.wikipedia.org/zh-tw/流量明星
  - https://www.threads.com/@marugoigoi/post/DcSu1TSkRMV
