id: 海王
category: slang
fork_type: C
display:
  taiwan: 花心大少 / 到處放線的人
  china: 海王
etymology:
  origin: 中國網路借 DC 英雄「海王」（Aquaman 統治海洋）比喻「同時經營多個曖昧對象」的人——「海裡養魚」，衍生「魚塘」「養魚」「中央空調」詞族。台灣說「花心」「劈腿」「腳踏多條船」，缺乏同等戲謔的名詞化人設標籤。
notes: 飯圈與情感類人設詞（海王／渣男／綠茶／白蓮花）成組輸入，台灣年輕世代已普遍理解。
sources:
