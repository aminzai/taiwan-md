id: 淡人濃人
category: slang
fork_type: C
display:
  taiwan: 無公認對應（性格淡定型 vs 熱烈型）
  china: 淡人 / 濃人
etymology:
  origin: 2024 年中國網路人設分類詞：「淡人」情緒穩定寡淡、對什麼都「還好」；「濃人」熱情外放、情緒濃烈。是 MBTI 測驗文化的中國本土化變形。台灣生活風格媒體（PopDaily、Yahoo）直接整組沿用報導，未造替代詞，屬媒體無阻力輸入的案例。
notes: 台灣媒體「直接沿用報導」是第三波流行語滲透的新通道——不經社群爭論、由內容農場式媒體直接鋪貨。
sources:
  - https://www.popdaily.com.tw/constellation/1514770
added: '2026-08-04'
updated: '2026-08-04'
