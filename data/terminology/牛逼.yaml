id: 牛逼
category: slang
fork_type: E
display:
  taiwan: 很強 / 很屌 / 超猛
  china: 牛逼（牛B、牛批、NB）
etymology:
  origin: 中國北方口語粗話，形容極厲害，衍生「裝逼」「傻逼」同族詞。PTT 歷年「最受不了的中國用語」票選常客，反感原因除了語感粗俗，也因台灣本有「很屌」「超猛」等對應。台灣年輕遊戲圈與直播圈受中國實況文化影響已可聞此詞。
notes: 含「逼」字詞族（牛逼／裝逼／撕逼）是台灣社群反感度最高的一批，因粗話色彩在台語感更重。
sources:
