id: 甩鍋
category: slang
fork_type: C
display:
  taiwan: 推卸責任 / 卸責
  china: 甩鍋
etymology:
  origin: 「鍋」在中國網路指黑鍋（背鍋＝背黑鍋），「甩鍋」即把責任甩給別人，2020 年後因國際政治新聞（外交部發言）高頻出現而擴散。台灣本有「推卸責任」「牽拖」（台語）。「背鍋／甩鍋／接鍋」詞族經電競圈（誰背這場敗局的鍋）先行輸入台灣。
notes: 台語「牽拖」是語感最接近的本土對應。電競圈是此詞族的主要輸入通道。
sources:
  - https://issues.ptsplus.tv/articles/992/
