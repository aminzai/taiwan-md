id: 白蓮花
category: slang
fork_type: C
display:
  taiwan: 裝無辜 / 假聖人
  china: 白蓮花
etymology:
  origin: 原指佛教聖潔意象，中國宮鬥劇與網路文化把它反轉成貶義：表面純潔善良、實則精於算計的角色人設，與「綠茶」近義但更強調「無辜人設」。台灣觀眾透過陸劇（《甄嬛傳》等）大量接觸此詞，慣用對應是「裝無辜」「假掰」「假仙」（台語）。
notes: 陸劇宮鬥文化輸入詞；台語「假仙」是最貼近的本土對應。
sources:
