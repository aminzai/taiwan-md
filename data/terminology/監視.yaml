etymology:
  origin: monitor／surveillance 的語域分流：台灣「監視」用於安全語境（監視器、被監視）、「監控」偏工程語境（機房監控、監控系統）；中國「監控」是統稱，監控攝像頭、被監控。中國新聞與科技內容大量輸入後，台灣口語中「監控」的使用範圍擴大，逐漸覆蓋「監視」的語域。
