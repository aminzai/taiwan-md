id: 硫酸紙
category: daily
subcategory: 日常生活
fork_type: F
auto_convert: false # 同詞不同語感：中國側的詞在台灣另有正當用法，盲目取代會改壞正確文字
display:
  taiwan: 描圖紙 / 透寫紙
  china: 硫酸紙
etymology:
  origin: 一種半透明、可透光的紙，用於描圖、書籍扉頁與包裝。中文世界有三個名字並存：描圖紙（功能命名）、透寫紙（維基百科主條目名）、硫酸紙（製程命名，紙張經硫酸處理而得半透明性）。中國以「硫酸紙」為主流稱呼，台灣一般讀者熟悉的是「描圖紙」。
  taiwan_path: 台灣文具與製圖脈絡稱「描圖紙」；印刷、出版與紙業從業者也會說「硫酸紙」，強調的是紙材特性而非用途。
  china_path: 「硫酸纸」是中國紙業與印刷業的標準稱呼，日常語境也通用。
  fork_cause: 同一物件的命名邏輯不同（功能 vs 製程），加上兩地產業術語各自標準化。
usage:
  example: 這本詩集的扉頁夾了一張描圖紙。
  note: 台灣印刷與出版業內部亦有人稱硫酸紙，強調的是紙材製程而非用途，非一律屬中國用語。
  taiwan_formal: true
  taiwan_casual: false
status: shifting
notes: |
  ⚠️ 查證分歧誠信標註，事件仍在進行中：2026-08 台積電文學獎得獎作品因為用了「平替」「硫酸紙」
  被讀者質疑吸收中國網路語彙，爭議延燒到文學獎評審與教育現場。
  但同一時間有出版業工作者出面說明，二十年前台灣高中化學課與出版業內就有人這樣稱呼這種紙，
  並區分兩個詞的語感：「描圖紙」偏功能性定義，作為書籍扉頁取其朦朧透光特性時會傾向說「硫酸紙」。
  查證結論：這不是單純的「是／不是支語」二分題——台灣一般讀者確實以「描圖紙」為預設，
  但「硫酸紙」在台灣特定產業內有使用紀錄，不宜逕自認定為外來詞。收錄目的是保存這次爭議的查證紀錄。
