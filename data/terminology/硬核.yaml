id: 硬核
category: slang
fork_type: C
display:
  taiwan: 硬派 / 哈扣（音譯）
  china: 硬核
etymology:
  origin: 英文 hardcore 的翻譯分流：台灣 ACG 與音樂圈早年音譯「哈扣」或意譯「硬派」（硬派遊戲、硬派搖滾），中國譯「硬核」並在 2018 年後泛化為「很強悍、很扎實」的萬用形容（硬核科普、硬核操作）。泛化用法回流台灣後，Threads 有網友發文問「硬核的台灣用語是什麼？想不出來」——顯示台灣原有譯法已被年輕世代遺忘。
notes: 台灣原譯（硬派／哈扣）存在但世代斷層，是「翻譯資產流失」的案例。
sources:
