id: 社死
category: slang
fork_type: C
display:
  taiwan: 糗爆 / 尷尬到想鑽地洞
  china: 社死（社會性死亡）
etymology:
  origin: 「社會性死亡」的縮略，指在公開場合出糗到「這個人在社交圈等於死了」的程度。原是社會學概念（相對於生理死亡的社會性死亡），中國網路 2020 年轉義爆紅。台灣年輕世代已高頻使用「社死」，本土近似說法「糗爆」「丟臉丟到家」語感較輕，缺乏「死亡」的誇飾強度。
notes: 已高度收編：台灣年輕世代日常使用，長輩世代不解其意，是世代斷層詞。
sources:
  - https://zh.wikipedia.org/wiki/社会性死亡
added: '2026-08-04'
updated: '2026-08-04'
