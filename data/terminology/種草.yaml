id: 種草
category: slang
fork_type: E
display:
  taiwan: 推坑 / 生火（拔草＝滅火、退坑）
  china: 種草（拔草）
etymology:
  origin: 中國電商內容行銷核心詞：被勸敗叫「被種草」，買了或打消念頭叫「拔草」，小紅書整個平台生態被稱為「種草經濟」。台灣鄉民與 ACG 圈本有完整對應詞組：「推坑」「生火」（被燒到想買）與「滅火」「退坑」，語意幾乎一對一，是台灣原生詞彙可完全抵換的罕見案例。
notes: 台灣本有對應詞組（推坑／生火／滅火）且仍活躍，適合在轉換器中主打。
sources:
  - https://dailyview.tw/popular/detail/10975
