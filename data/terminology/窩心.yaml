id: 窩心
category: daily
fork_type: E
display:
  taiwan: 窩心（暖心義；南方固有用法）
  china: 窩心（部分北方語境為貶義，鬱悶／窩囊之意）
etymology:
  origin: 「窩心」在南方（含台灣、江南、香港）語境是褒義，指暖心、貼心；但在北方官話語境卻是貶義，指窩囊、鬱悶。台灣「窩心＝暖心」是南方固有用法的延續，並非中國傳入，反而是台灣這一義項近年隨兩岸交流擴散回中國網路，方向與一般假設的「中國傳入台灣」相反。
notes: '⚠️ 誤判翻案案例：常被誤會成中國網路新造詞或誤判詞義流向，實際是南北語感長期並存的固有分歧，且台灣「暖心」義項是向外擴散的一方，收錄目的是保存查證紀錄。'
sources:
