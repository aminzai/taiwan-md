id: 精緻感
category: slang
fork_type: C
display:
  taiwan: 講究 / 精緻
  china: 精緻感（精致感）
etymology:
  origin: 「精緻」二字兩岸共有，「精緻感」是小紅書「N＋感」公式的產物，常與「精緻女孩」「精緻生活」連用，隱含消費主義的儀式化生活想像。台灣直接用「精緻」「講究」即可表達，「感」字後綴是識別中國輸入的標記。
notes: 原詞共有、公式化後綴輸入——「N＋感」家族成員。
sources:
  - https://www.threads.com/@arthur_yuu
