id: 素質
category: daily
subcategory: 日常用語
fork_type: F
auto_convert: false # 同詞不同語感：中國側的詞在台灣另有正當用法，盲目取代會改壞正確文字
display:
  taiwan: 素質（台灣本有詞）
  china: 素質（國民素質、素質教育）
etymology:
  origin: 「素質」古義為白色的質地（《爾雅．釋鳥》）與本質（《文選．張華．勵志詩》），教育部《重編國語辭典修訂本》兩義都收。當代台灣用法涵蓋身體素質、心理素質、教師素質、人口素質等，論文、政府文件、教科書長期在用；中國則發展出「國民素質」「素質教育」「有素質／沒素質」這組帶道德評價的高頻用法。
  taiwan_path: 台灣的「素質」多為中性描述（身體素質、心理素質、師資素質），評價一個人的言行時習慣說「水準」「教養」「品格」。
  china_path: 中國「素質」承載強烈的道德評價功能，罵人「沒素質」等同於罵沒教養，並進入官方教育政策語彙（素質教育）。
  fork_cause: 同詞不同語用強度：台灣保留描述義，中國擴張出評價義。
usage:
  example: 這批新血的專業素質很整齊。
  note: 誤判翻案條目——「素質」是台灣本有詞，不需要換掉；差別只在語用強度（台灣中性描述／中國道德評價）。
  taiwan_formal: true
  taiwan_casual: true
status: stable
notes: |
  ⚠️ 誤判翻案案例：網路流傳的支語清單常把「素質」整個詞判為中國用語，
  查證不成立——這個詞在台灣的論文、各級政府機關文件、文學作品中長期大量出現。
  2024 年一則 Threads 貼文（@lukelu0913）已就此提出完整反駁，重點是「不應矯枉過正，
  誤把台灣有在使用的詞彙定義為支語」。2026-08 的 Threads 討論串裡仍有人把「水準→素質」
  列進替換清單，可見這個誤判還在流通。
  真正存在的差異是語用強度（台灣中性描述／中國道德評價），不是詞的有無——收錄目的是保存這份查證紀錄。
sources:
