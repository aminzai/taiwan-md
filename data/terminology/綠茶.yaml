id: 綠茶
category: slang
fork_type: C
auto_convert: false # 命中自家正文 ≥ 20 處，同形異義風險高（2026-09-05 sweep 批四）
display:
  taiwan: 心機女 / 做作女
  china: 綠茶（綠茶婊）
etymology:
  origin: 2013 年中國網路事件催生「綠茶婊」一詞：表面清純無害、實則心機深沉的女性形象，後縮略為「綠茶」，並發展成可形容行為的「茶言茶語」「這很茶」。台灣本有「心機女」「做作」「假掰」等說法，語感直白，缺乏「綠茶」的隱喻包裝。
notes: 對女性的人設標籤詞，使用時涉及性別刻板印象爭議，兩岸皆有相關批評討論。
