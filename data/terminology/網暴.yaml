id: 網暴
category: internet
fork_type: C
display:
  taiwan: 網路霸凌 / 網路公審
  china: 網暴（網絡暴力）
etymology:
  origin: 「網絡暴力」的縮略。台灣從教育與法律脈絡定型「網路霸凌」（cyberbullying 的翻譯），中國則從社會新聞脈絡定型「網暴」。二字縮略形式經微博熱搜文化強化，比四字的「網路霸凌」傳播更快，台灣社群已可見混用。
notes: 台灣「公審」一詞涵蓋部分「網暴」語意（發起群眾撻伐），是本土近似詞。
sources:
