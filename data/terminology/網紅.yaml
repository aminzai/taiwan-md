display:
  taiwan: 網紅（已通用；早期說「部落客」「網路名人」）
  china: 網紅（網絡紅人）
etymology:
  origin: 「網絡紅人」的縮略，2015 年前後隨中國直播經濟爆發定型。台灣早期依平台分稱「部落客」「YouTuber」「直播主」，沒有統稱詞，「網紅」補上這個空缺後快速通用化，如今連台灣媒體、政府文宣都使用，是「輸入→完全收編」的代表案例。READr 的 Dcard 語料分析將其列為滲透最成功的詞之一。
notes: 收編完成：台灣已無替代統稱。記錄它的價值在於保存「這個詞是怎麼進來的」的時間線。
