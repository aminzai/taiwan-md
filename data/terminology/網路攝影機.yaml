etymology:
  origin: camera 的兩岸翻譯分流：台灣依用途細分「網路攝影機」（webcam）、「鏡頭」（手機鏡頭）、「監視器」；中國統稱「攝像頭」，手機攝像頭、監控攝像頭、電腦攝像頭一詞通用。台灣讀者搜尋「攝像頭」的量在本站 Search Console 居高（月曝光 177 次），多來自看中國 3C 評測影片後的困惑。
