id: 翻車
category: slang
fork_type: E
display:
  taiwan: 出包 / 翻車
  china: 翻車
etymology:
  origin: 中國網路指「原本順利的事當場失敗出醜」：直播翻車、人設翻車。台灣本有「出包」（台語「出鎚」的華語化）承載相同語意。「翻車」經直播文化輸入後，台灣年輕世代兩詞並用，「翻車現場」等句式已常見於台灣社群。
notes: 台灣「出包／出鎚」仍活躍，屬可抵換詞。
sources:
  - https://www.ptt.cc/bbs/WomenTalk/M.1672998855.A.CD5.html
