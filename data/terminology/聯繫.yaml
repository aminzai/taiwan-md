id: 聯繫
category: daily
subcategory: 日常用語
fork_type: F
auto_convert: false # 同詞不同語感：中國側的詞在台灣另有正當用法，盲目取代會改壞正確文字
display:
  taiwan: 聯絡
  china: 聯繫（跟他聯繫一下）
etymology:
  origin: 兩個詞在教育部《重編國語辭典修訂本》裡互相定義——「聯繫」釋為「連絡」，例句「請以電話與我聯繫」；「聯絡」釋為「連繫」，例句「記得打通電話給他，聯絡一下情感」。兩詞台灣都收、都合法，分歧在日常口語的預設選擇。
  taiwan_path: 台灣口語與商務往來預設「聯絡」（聯絡人、聯絡方式、保持聯絡），「聯繫」多見於正式公文與書面語。
  china_path: 中國口語與書面語預設「聯繫」（聯繫方式、取得聯繫、聯繫我們），並衍生「有聯繫」「聯繫不上」等固定搭配。
  fork_cause: 同義詞的預設偏好差異，非詞彙有無。
usage:
  example: 記得跟他聯絡一下，別讓人家空等。
  note: 誤判翻案條目——「聯繫」是教育部辭典收錄、台灣公文長期使用的詞，不是外來詞；差別在日常口語的預設是「聯絡」。
  taiwan_formal: true
  taiwan_casual: true
status: shifting
notes: |
  ⚠️ 誤判翻案案例（附讀者需求紀錄）：常被列入支語清單，但「聯繫」是教育部辭典正式收錄、
  台灣公文書長期使用的詞，判為外來詞不成立；真正的差異是「聯絡」在台灣日常的預設地位正在被稀釋。
  本站 Search Console 過去 28 天有 33 次曝光的讀者在搜這個詞（平均排名 2.5），
  代表確實有人想知道答案——與其不收錄，不如把查證結果留在這裡：兩個都是台灣的詞，台灣習慣講「聯絡」。
sources:
