id: 肯定
category: daily
subcategory: 日常用語
fork_type: F
auto_convert: false # 同詞不同語感：中國側的詞在台灣另有正當用法，盲目取代會改壞正確文字
display:
  taiwan: 一定 / 絕對
  china: 肯定（他肯定還在睡覺）
etymology:
  origin: 「肯定」當副詞表示「必定、毫無疑問」。這個義項台灣辭典本來就收——教育部《重編國語辭典修訂本》「肯定」條列有「必定、毫無疑問」，例句「雷電交加，看情形肯定會下一場大雨了。」分歧不在詞的有無，在日常口語會不會自然講出來。
  taiwan_path: 台灣口語表達「必定」時預設用「一定」「絕對」「鐵定」「肯定」則多出現在「肯定某人的貢獻」「備受肯定」這類「給予正面評價」的動詞用法。
  china_path: 中國口語把「肯定」當作高頻確信副詞，「肯定會」「肯定沒有」是日常說法。
  fork_cause: 同詞多義下的義項偏好差異，副詞義在中國口語佔比高、在台灣口語佔比低。
usage:
  example: 他一定還在睡覺，你先別打給他。
  taiwan_formal: true
  taiwan_casual: true
  exceptions: 「他的努力值得肯定」「肯定句」等評價／文法用法是台灣標準用詞，與本條無關。
status: shifting
notes: |
  ⚠️ 查證分歧誠信標註：詞在台灣辭典有據，爭的是語感與頻率。
  Threads 用語策展者 @thiankiu.to 2026-07-17 直接用這個詞當例子講方法論：
  「台灣有『肯定』，中國也有『肯定』，但把『肯定』當作必定的意思在用就是支語」，
  並舉對照句「他一定還在睡覺（臺灣用法）／他肯定還在睡覺（中國用法）」。
  本條收錄的是這組對照句本身，不對「算不算支語」下判定——這是讀者搜到這裡時最需要的東西：
  知道兩種說法各自的語感落點，自己決定要用哪個。
sources:
  - https://www.moedict.tw/uni/肯定
  - https://www.threads.com/@marugoigoi/post/DcSu1TSkRMV
