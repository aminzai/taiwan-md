id: 脫單
category: slang
fork_type: C
display:
  taiwan: 交到對象 / 脫離單身
  china: 脫單
etymology:
  origin: 「脫離單身」的縮略，中國光棍節（雙11）文化的衍生詞，與「脫貧」對仗形成「脫貧脫單」句式。台灣描述性地說「交到男／女朋友」「終於有對象了」，無對應縮略詞，因省力性「脫單」已在台灣年輕世代與交友軟體文案中普及。
notes: Threads 網友觀察此詞「在台灣也略有使用」，屬收編中段。
sources:
