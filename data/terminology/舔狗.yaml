id: 舔狗
category: slang
fork_type: E
display:
  taiwan: 工具人（近似）/ 舔狗
  china: 舔狗
etymology:
  origin: 中國網路指「在感情中毫無底線討好對方的人」，語感強烈自貶。台灣本有「工具人」（被當工具使喚卻沒有感情回報的人），視角不同：工具人強調被利用，舔狗強調主動卑微。因語意缺口互補，台灣年輕世代兩詞並用，「舔狗」已高度在地化。
notes: 台灣「工具人」是 2000 年代 PTT 原生詞，先於「舔狗」存在；兩詞並存分工中。
sources:
