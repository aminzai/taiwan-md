id: 花生
category: food
fork_type: semantic

display:
  taiwan: 土豆
  china: 花生

auto_convert: false # 台灣華語標準用詞同為「花生」，「土豆」是台語 thóo-tāu 的漢字寫法；轉換器不可把正文「花生」改成「土豆」（2026-09-05 還原時加註）

notes: '同一個詞「土豆」在兩岸指不同東西：台灣（台語 thóo-tāu）指花生，中國指馬鈴薯。這條記的是台語層的語意分歧，不是華語轉換規則；華語層台灣也說「花生」。2026-09-05 詞庫拆修批次曾以「台灣土豆通常指馬鈴薯」為由刪除，該理由與事實相反（把中國義當成台灣義），且本條是 fork-graph 精選詞（_fork-graph-featured.yaml）的內容源，故還原。姊妹條目：馬鈴薯.yaml（台灣 馬鈴薯／中國 土豆）。'

sources:
  - 'fanhuaji-config'
  - '教育部臺灣台語常用詞辭典「土豆」：花生'

added: '2026-03-31'
