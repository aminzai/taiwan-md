id: 薅羊毛
category: slang
subcategory: 網路與社群
fork_type: E
display:
  taiwan: 撿便宜 / 衝優惠 / 賺回饋
  china: 薅羊毛（羊毛黨）
etymology:
  origin: 出自 1999 年中國央視春晚小品《昨天·今天·明天》，宋丹丹飾演的「白雲」講到替生產隊放羊時「薅社會主義羊毛」——薅下集體的羊毛替人織毛衣，意思是佔集體的小便宜。後來成為網路迷因，並在電商時代轉義為「極力搜刮平台優惠」，專門鑽優惠漏洞的人被稱為「羊毛黨」。
  taiwan_path: 台灣說「撿便宜」「賺回饋」「衝優惠」「刷點數」；針對鑽漏洞的行為說「鑽漏洞」「洗優惠」。
  china_path: 春晚小品梗 → 網路流行語 → 電商優惠券套利的專門術語（羊毛黨、擼羊毛）。
  fork_point: '~2010s'
  fork_cause: 中國電商平台補貼戰催生的專門詞彙，台灣的信用卡回饋與點數文化長出的是另一套說法。
usage:
  example: 這張卡的回饋很好賺，大家都在衝優惠。
  note: 針對鑽優惠漏洞的行為，台灣說「鑽漏洞」「洗優惠」。
  taiwan_formal: false
  taiwan_casual: false
status: shifting
notes: |
  2026-07 台灣一則受訪影片因為受訪者說了「薅羊毛」而被網友出征，反過來又引發
  「脆上的人為什麼那麼愛攻擊別人用支語」的反彈討論（該則反彈貼文 9,666 讚），
  是觀察社群鐘擺從「警戒滲透」擺向「警戒過度糾察」的具體案例。
  詞源清楚可考（1999 年春晚），屬於中國固有俗語經網路轉義，不是誤判型。
sources:
