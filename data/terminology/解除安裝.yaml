id: 解除安裝
category: tech
subcategory: 軟體與程式開發
fork_type: C

display:
  taiwan: 解除安裝
  china: 卸載

etymology:
  origin: 把軟體 uninstall、從裝置上移除。台灣說「解除安裝」（對應「安裝」的反向動作，語意直白），中國說「卸載」（從「裝載」引申的卸下）。

usage:
  example: 手機空間不夠，我把幾個沒在用的 App 解除安裝騰出空間。

notes: ''

sources:
  - 'ThunderKO C2T / 《大陸用語檢索手冊》1997'

