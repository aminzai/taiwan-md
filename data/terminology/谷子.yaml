id: 谷子
category: slang
fork_type: A
display:
  taiwan: 周邊
  china: 谷子（吃谷／谷店）
etymology:
  origin: 英文「goods」音譯，經日語「グッズ」（guzzu，動漫周邊商品）中介傳入，屬日本 ACG 文化衍生詞而非中國原創。近年經中國同人／二次元社群把「谷子」「吃谷」（購買周邊）「谷店」（周邊實體店）等衍生用法做大做熱，隨小紅書、B 站社群擴散，台灣 ACG 圈已有網友吐槽「換成聽不懂的支語」。
notes: 日源詞經中國二次加工再輸入的典型路徑（同型：佛系、打call、課金→氪金），台灣同好圈原用「周邊」，此詞經二次元社群持續滲入中。
