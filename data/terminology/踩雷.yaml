id: 踩雷
category: daily
fork_type: F
display:
  taiwan: 踩雷 / 踩到地雷
  china: 踩雷
etymology:
  origin: 台灣鄉民文化早有「地雷店」「地雷片」「踩到地雷」的用法（PTT 美食板 2000 年代即常見），指遇到名不符實的店家或作品；中國網路也發展出「踩雷」「避雷」「排雷」一整組詞，經小紅書美妝評測文化強化後回流。兩岸用法高度相似，屬平行發展後互相強化的例子，難以斷定單向輸入。
notes: F 型同詞同感：台灣本有用法，非典型支語。收錄原因是讀者常查「踩雷是不是支語」，答案是：台灣自己就有。
sources:
