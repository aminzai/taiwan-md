id: 邊界感
category: slang
fork_type: E
display:
  taiwan: 界線 / 分寸
  china: 邊界感
etymology:
  origin: 中國小紅書 2026 年度熱詞之一，指拒絕他人（尤其家族長輩）越界干涉個人生活的社交態度，常與家庭代際衝突話題（如過年被逼問終身大事）一起討論。台灣概念上接近「界線」「分寸」，但作為固定詞組尚未見台灣網路普遍使用。
notes: 「N＋感」造詞公式的延伸（同型：鬆弛感、活人感），屬 2026 上半年小紅書熱詞榜，列入觀察。
sources:
  - https://www.163.com/dy/article/KQUHNKA30531B128.html
added: '2026-08-05'
updated: '2026-08-05'
