id: 配得感
category: slang
fork_type: C
display:
  taiwan: 自我價值感（心理學：deservingness）
  china: 配得感
etymology:
  origin: 中國心理自媒體 2024 年前後的新造詞，指「覺得自己配得上美好事物」的心理狀態，常以「配得感低」描述不敢接受讚美或好運的人。對應心理學概念 deservingness（台灣學術譯「應得感」「值得感」）。Threads 已有台灣網友發文問「最近偶然看到幾次『配得感』，是支語嗎？」——正處於輸入初期的辨識階段。
notes: 2024-2026 最新一波心理狀態詞的代表，滲透初期、台灣尚無定型對應。
sources:
  - https://www.threads.com/@wyt_yu_ting
  - https://www.unlazy-mind.com/knowledge/psy-scales/deserving
added: '2026-08-04'
updated: '2026-08-04'
