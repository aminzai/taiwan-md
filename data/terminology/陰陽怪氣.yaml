id: 陰陽怪氣
category: daily
fork_type: E
display:
  taiwan: 酸言酸語
  china: 陰陽怪氣
etymology:
  origin: 指表面平和、實則夾帶諷刺挖苦的語氣或態度。「陰陽怪氣」本身是兩岸共有的老詞，分歧出現在詞性——形容詞用法是共同遺產，動詞用法是中國網路時代的新發展。
  taiwan_path: 形容詞用法（「這個人陰陽怪氣的」）收錄於教育部《重編國語辭典修訂本》，釋義「性情古怪，令人捉摸不定」，是正統國語。
  china_path: 中國網路把「陰陽怪氣」動詞化——「別陰陽怪氣我」「他又在陰陽怪氣」，指用反話冷嘲熱諷，並衍生縮寫「yygq」。
  fork_cause: 詞性分歧——形容詞是兩岸共有的既有用法；把它直接當動詞用（「陰陽怪氣某人」）是中國網路社群的新用法。
usage:
  example: 形容詞用法台灣本來就有——「他這個人陰陽怪氣的，讓人捉摸不定。」要換的是動詞用法——「別陰陽怪氣我」→「別在那邊假鬼假怪」。
  exceptions: 僅動詞用法（「別陰陽怪氣我」）屬中國網路用語；形容詞用法（「這個人陰陽怪氣的」）為教育部《重編國語辭典修訂本》收錄的正統國語（釋義「性情古怪，令人捉摸不定」），不在標記範圍。
notes: 來源：caris-events/invade (CC0)
