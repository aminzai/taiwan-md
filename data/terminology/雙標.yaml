id: 雙標
category: slang
fork_type: C
display:
  taiwan: 雙重標準 / 雙標
  china: 雙標
etymology:
  origin: 「雙重標準」的二字縮略，經中國微博論戰文化高頻使用後定型，衍生「雙標狗」等罵法。台灣本有完整詞「雙重標準」，縮略形「雙標」因省力已被台灣社群廣泛採用，屬縮略形式滲透（同型：網暴、內卷）。
notes: 原詞兩岸共有，滲透的是「縮略形式」——這類案例在支語判定上最容易起爭議。
sources:
  - https://www.readr.tw/post/2553
