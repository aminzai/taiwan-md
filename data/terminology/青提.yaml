id: 青提
category: food
fork_type: E
display:
  taiwan: 葡萄（青提為港澳固有稱法）
  china: 青提
etymology:
  origin: 「青提」是港澳粵語圈日常慣用的葡萄品種稱呼（對應綠葡萄），並非中國大陸網路新造詞。2026 年台灣一間甜點店把菜單上的葡萄標成「青提」，被網友當成「中國用語入侵」出征，事後查證這其實是粵語地區行之有年的固有講法，跟「支語」無關。
notes: '⚠️ 誤判翻案案例：常被誤扣「支語」帽子，實為港澳粵語固有詞彙，收錄目的是保存查證紀錄，避免詞庫變成隨意出征的黑名單。'
sources:
