id: 預制感
category: slang
fork_type: E
display:
  taiwan: 罐頭感 / 制式感
  china: 預制感（預制人）
etymology:
  origin: 借用「預製菜」（中央廚房統一調理包裝的半成品菜餚）比喻人被模板化、對話與反應像是提前寫好的劇本，缺乏真實感。2024 年底中國網路開始討論「預制人」現象，2025 年「預制 XX」入選中國官方《咬文嚼字》年度十大流行語。台灣尚無單一對應詞，概念接近「罐頭式回應」「制式感」。
notes: 常見完整形式「預制人」與「預制感」兩種用法並存，本條以「預制感」為主詞條、notes 涵蓋「預制人」異形。
sources:
