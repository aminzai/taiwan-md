id: 顯眼包
category: slang
fork_type: C
display:
  taiwan: 活寶 / 愛搶鏡的人
  china: 顯眼包
etymology:
  origin: 中國方言「顯眼」（出風頭）加後綴「包」（如淘氣包），2023 年爆紅並入選官方年度流行語，指行為誇張、自帶喜感、走到哪都吸睛的人，多為善意調侃。台灣近似說法「活寶」「戲精」（後者本身也是中國輸入詞）、台語「愛現」。台灣媒體報導時多直接沿用原詞。
notes: 台語「愛現」語感最貼近但缺名詞化形式。「包」系構詞（淘氣包／顯眼包）在台灣構詞法中少見。
sources:
  - https://www.storm.mg/lifestyle/4953010
