id: 體現
category: daily
subcategory: 日常用語
fork_type: F
auto_convert: false # 同詞不同語感：中國側的詞在台灣另有正當用法，盲目取代會改壞正確文字
display:
  taiwan: 展現 / 呈現 / 表現出
  china: 體現（充分體現、體現了）
etymology:
  origin: 「體現」指具體展現某種理論或精髓，教育部《重編國語辭典修訂本》收錄並舉例「這本書深切體現了儒家思想」——是台灣辭典有據的詞，不是中國新造。差別在頻率與搭配：中國書面語與官方文書大量使用「充分體現」「集中體現」這類固定搭配，台灣同一位置多用「展現」「呈現」「反映」。
  taiwan_path: 台灣書面語偏好「展現」「呈現」「反映出」，「體現」出現在學術與評論文體，日常對話罕見。
  china_path: 「體現」是中國公文與媒體語的高頻動詞，常與「充分」「集中」「深刻」搭配成套語。
  fork_cause: 同詞在兩地的文體分布不同：台灣屬學術書面詞，中國屬通用公文詞。
usage:
  example: 這本書展現了儒家思想的核心。
  note: 「體現」在教育部辭典有據，非外來詞；要留意的是「充分體現」「集中體現」這類公文套語的味道。
  taiwan_formal: true
  taiwan_casual: false
status: shifting
notes: |
  ⚠️ 誤判翻案案例：2026-08 Threads 一則被大量轉發的留言（@nataliegreenday）把
  「體現、具體、關注、舉報」整組列為「無庸置疑的中國用語」，並對照自己記憶中的
  「呈現、明確、焦點、檢舉」。查證結果：「體現」在教育部辭典裡有完整義項與例句，
  說它不是中文、不是台灣的詞並不成立。
  成立的部分是語感觀察——台灣人在日常對話說「體現」確實少見，多半是書面語，
  且「充分體現」這類公文套語確實有中國文書的味道。詞的歸屬與搭配的味道是兩件事。
  另注意同組被點名的「關注」「舉報」，詞庫已有獨立條目（關注→追蹤／舉報→檢舉），是社群功能詞層的分歧。
sources:
  - https://www.moedict.tw/uni/體現
  - https://www.threads.com/@marugoigoi/post/DcSu1TSkRMV
