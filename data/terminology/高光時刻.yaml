id: 高光時刻
category: slang
fork_type: C
display:
  taiwan: 精彩時刻 / 最風光的一刻
  china: 高光時刻
etymology:
  origin: 源自英文 highlight 的中國譯法，先在電競與體育轉播圈流行（賽事精華＝高光集錦），再擴散到日常語境指人生最精彩的瞬間。台灣轉播圈慣用「精彩畫面」「精華片段」，形容人則說「最風光的時刻」。美妝的 highlight 台灣譯「打亮」，中國譯「高光」，同一個英文字在兩岸走出兩條翻譯路徑。
notes: 與美妝詞「高光／打亮」同源不同域，可互相參照。
sources:
  - https://dailyview.tw/popular/detail/21332
