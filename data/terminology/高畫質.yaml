id: 高畫質
category: tech
subcategory: 媒體與影音
fork_type: C
auto_convert: false # 命中自家正文 ≥ 20 處，同形異義風險高（2026-09-05 sweep 批四）

display:
  taiwan: 高畫質
  china: 高清

etymology:
  origin: 影像、影片的 high-definition（HD）。台灣說「高畫質」（強調「畫質」），中國說「高清」（高清晰度的縮寫）。

usage:
  example: 這部片有高畫質版本，用大電視看細節清楚很多。

detection:
  severity: B
  false_positives:
    - pattern: '高清愿'
      note: '人名高清愿（統一企業創辦人），含「高清」字串'
    - pattern: '清高'
      note: '「清高」指高潔的人，是「高清」的倒序組合'

notes: ''

sources:
  - 'ThunderKO C2T / 《大陸用語檢索手冊》1997'

added: '2026-03-30'
updated: '2026-06-22'
