id: 高級感
category: slang
fork_type: C
display:
  taiwan: 質感 / 高雅 / 高檔
  china: 高級感
etymology:
  origin: 小紅書美學詞，形容低調卻顯貴的氣質或設計。台灣既有詞「質感」承載幾乎相同語意（「很有質感」），「高級感」輸入後兩詞在台灣美妝與設計文案中競爭。Threads 高讚貼文（1.1 萬讚）將其列為「小紅書支那語」首位，建議改說「奢華」「有氣質」。
notes: 台灣「質感」是強勢本土對應，抵換率高。
sources:
  - https://www.threads.com/@arthur_yuu
