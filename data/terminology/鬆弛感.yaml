id: 鬆弛感
category: slang
fork_type: C
display:
  taiwan: 從容 / 自在 / 慵懶
  china: 鬆弛感（松弛感）
etymology:
  origin: 2022 年中國微博博主觀察「遇突發狀況也不慌張的家庭」創出此詞，經小紅書穿搭與生活風格內容爆量傳播，入選中國官方《咬文嚼字》年度流行語。指不緊繃、不用力過猛的狀態或穿搭風格。台灣網友點名的對應說法是「從容」「自在」「慵懶」「隨性」——都存在，但沒有一個詞同時涵蓋「人生態度＋美學風格」的雙重用法。Threads 上「支語退散」社群對此詞討論熱烈（「鬆個屁的弛」貼文 1,386 讚）。
notes: 「N＋感」造詞公式的代表詞。中國官方年度流行語認證讓「這是支語」的判定無爭議。
sources:
  - https://www.pttweb.cc/bbs/Gossiping/M.1781611588.A.84C
  - https://zh.wikipedia.org/zh-tw/松弛感
