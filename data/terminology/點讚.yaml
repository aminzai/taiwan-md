id: 點讚
category: internet
fork_type: C
display:
  taiwan: 按讚
  china: 點讚（點贊）
etymology:
  origin: Facebook 的 Like 在台灣在地化為「按讚」（2010 年前後定型），中國平台（微博、微信）則譯「點贊」。一字之差成為兩岸社群文化的識別標記。台灣網友表示看到「點讚」出現在台灣媒體標題時特別敏感，因為「按讚」是台灣自己長出的網路詞彙資產。
notes: 台灣「按讚」定型早於中國「點贊」普及，是台灣網路用語主權的代表詞。
sources:
