<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EZ WAY 局部試稿</title><style>body{max-width:720px;margin:40px auto;padding:0 24px;font:18px/1.9 system-ui;color:#233f3b;background:#f5f1e8}a{color:#9c4f35}</style><h2>包裹到了，確認還沒到？</h2>
<p>報關業者把貨物資料傳到 EZ WAY，收貨人核對並完成委任，業者才接著報關。若貨已到臺灣，人卻還沒回覆，包裹要等在哪裡？2026 年 1 月 29 日，關務署發稿回應媒體報導的承攬業通關疑慮，表示多數業者已在境外取得確認後才發貨。至於全面實施後，仍有貨先到、人未回覆的情況，署方當時預估現有倉容足以負荷。<a href="https://web.customs.gov.tw/singlehtml/2222?cntId=b1bc5147371d428590c00553ba094bd2">1</a></p>
<p>關務署在同一份稿件預告邀集公會說明配套；2 月的公告則記載，署方已與物流相關業者討論，並請報關業者在貨物抵臺前儘速推播。<a href="https://web.customs.gov.tw/singlehtml/2222?cntId=5b7a9da7e7674b4e90e0cee314f85191">1</a> 這些紀錄交代了機關打算怎麼接住未完成確認的包裹。實施後究竟有多少貨件需要等待、等待多久，這兩份公告還沒有答案。</p>
</html>
